<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>静态网站管理</title>
<style>
  :root {
    --bg: #0e1014; --panel: #16191f; --panel-2: #1b1f27; --border: #272c36;
    --text: #e7e9ef; --muted: #8a92a6; --accent: #4f7cff; --ok: #35d07f; --err: #ff6b6b;
    color-scheme: dark;   /* 原生控件（勾选框/下拉弹层/滚动条）跟随深色 */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* ---------- 登录 ---------- */
  #login {
    height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-box { width: 100%; max-width: 340px; text-align: center; }
  .login-box h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  .login-box p { color: var(--muted); font-size: 13px; margin: 0 0 26px; }
  .login-box input {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 13px 15px; font-size: 15px; outline: none; text-align: center;
    letter-spacing: 2px;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%; margin-top: 12px; background: var(--accent); color: #fff; border: 0;
    border-radius: 9px; padding: 13px; font-size: 15px; cursor: pointer; font-weight: 500;
  }
  .login-box button:hover { filter: brightness(1.1); }
  .err-text { color: var(--err); font-size: 13px; min-height: 20px; margin-top: 12px; }

  /* ---------- 主界面 ---------- */
  #app { max-width: 1040px; margin: 0 auto; padding: 36px 20px 72px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .top h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .top button {
    background: transparent; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 4px;
  }
  .top button:hover { color: var(--text); }
  .top-actions { display: flex; align-items: center; gap: 16px; }
  .top-link {
    color: var(--accent); font-size: 13px; text-decoration: none;
  }
  .top-link:hover { text-decoration: underline; }

  /* 拖拽区 */
  #drop {
    border: 2px dashed var(--border); border-radius: 14px; padding: 44px 20px;
    text-align: center; cursor: pointer; transition: .18s; background: var(--panel);
    margin-bottom: 30px;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: rgba(79,124,255,.06); }
  #drop .icon { font-size: 30px; margin-bottom: 10px; opacity: .85; }
  #drop .main { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
  #drop .sub { color: var(--muted); font-size: 13px; }
  #drop.busy { pointer-events: none; opacity: .6; }

  /* 手动新建 */
  .manual {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 30px;
  }
  .manual summary {
    cursor: pointer; color: var(--muted); font-size: 13.5px; list-style: none; user-select: none;
  }
  .manual summary::-webkit-details-marker { display: none; }
  .manual summary::before { content: '＋ '; }
  .manual[open] summary::before { content: '－ '; }
  .manual summary:hover { color: var(--text); }
  .manual-body { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .manual-body input {
    background: #0d0f14; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 13px; font-size: 14px; outline: none;
  }
  .manual-body input:focus { border-color: var(--accent); }
  .manual-body input#newName { flex: 1; min-width: 160px; }
  .manual-body input#newPort { width: 190px; }
  .manual-hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .port-edit { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .port-edit span { color: var(--muted); font-size: 12.5px; }
  .port-edit input { width: 130px; }
  .field-err { color: var(--err); font-size: 12.5px; margin-top: 6px; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 20px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.45);
    max-width: 90vw; z-index: 50;
  }
  .toast.ok { border-color: rgba(53,208,127,.4); }
  .toast.err { border-color: rgba(255,107,107,.45); }

  .sites-head {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 13px; margin-bottom: 12px; padding: 0 2px;
  }

  .site {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap; transition: border-color .15s;
  }
  .site:hover { border-color: #333a47; }
  .site-main { flex: 1; min-width: 0; }
  .site-name {
    font-size: 15px; font-weight: 500; margin-bottom: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .site-url {
    color: var(--accent); font-size: 13px; text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .site-url:hover { text-decoration: underline; }
  .site-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
  /* 警告：默认只留一个芯片，保证每行高度一致；点开才展开详情 */
  .warn-chip {
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    background: rgba(255, 192, 97, .12); border: 1px solid rgba(255, 192, 97, .35);
    color: #ffc061; border-radius: 999px; padding: 1px 8px; font-size: 11.5px;
    line-height: 1.5; cursor: pointer; font-family: inherit;
    transition: background .15s, border-color .15s;
  }
  .warn-chip:hover { background: rgba(255, 192, 97, .22); border-color: rgba(255, 192, 97, .55); }
  .warn-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .warn-panel {
    flex: 0 0 100%; order: 3; margin-top: 10px; padding: 12px 14px;
    background: rgba(255, 192, 97, .06); border: 1px solid rgba(255, 192, 97, .25);
    border-radius: 10px; display: flex; flex-direction: column; gap: 7px;
  }
  .warn-item { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.55; color: #ffd089; }
  .warn-item .idx {
    flex-shrink: 0; width: 16px; color: #ffc061; opacity: .7;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .site-actions { display: flex; gap: 7px; flex-shrink: 0; }
  .site-actions .btn { padding: 7px 11px; font-size: 12.5px; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: #3a4250; background: #202530; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger:hover { border-color: #4a2626; color: var(--err); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }

  /* ---------- 分类 ---------- */
  .cat-list { margin-top: 12px; }
  .cat-empty { color: var(--muted); font-size: 13px; padding: 6px 8px; }
  .cat-row {
    display: flex; align-items: center; gap: 9px; padding: 7px 8px;
    border-radius: 9px; border: 1px solid transparent; transition: .15s;
  }
  .cat-row:hover { background: var(--panel-2); border-color: var(--border); }
  .cat-row .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .cat-row input.cat-name {
    background: transparent; border: 1px solid transparent; color: var(--text);
    font-size: 14px; padding: 5px 8px; border-radius: 7px; outline: none;
    min-width: 110px; max-width: 260px; flex: 1; font-family: inherit;
  }
  .cat-row input.cat-name:hover { border-color: var(--border); }
  .cat-row input.cat-name:focus { background: #0d0f14; border-color: var(--accent); }
  .cat-row .cat-n { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .cat-row .acts { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .cat-row:hover .acts, .cat-row:focus-within .acts { opacity: 1; }
  .icon-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 7px; width: 28px; height: 28px; font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: #3a4250; }
  .icon-btn.danger:hover { color: var(--err); border-color: #4a2626; }
  .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  .cat-sys {
    font-size: 11.5px; color: var(--muted); background: var(--panel-2);
    border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px;
  }
  .cat-confirm {
    display: flex; align-items: center; gap: 10px; width: 100%;
    font-size: 13px; color: #ffc061; flex-wrap: wrap;
  }
  .cat-confirm .grow { flex: 1; }
  .cat-confirm .btn { font-size: 12.5px; padding: 6px 12px; }
  .cat-add { display: flex; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .cat-add input {
    flex: 1; background: #0d0f14; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 13px; font-size: 14px; outline: none; font-family: inherit;
  }
  .cat-add input:focus { border-color: var(--accent); }

  .sites-head .head-left { display: flex; align-items: center; gap: 14px; }
  .sites-head .head-right { display: flex; align-items: center; gap: 8px; }
  .pick-all { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  /* ---------- 勾选框：自绘，跟深色主题一致 ---------- */
  input[type="checkbox"] {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; margin: 0; flex-shrink: 0; position: relative;
    border: 1.5px solid #3a4250; border-radius: 5px; background: #0d0f14;
    cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s;
  }
  input[type="checkbox"]:hover { border-color: #4d5770; background: #12161d; }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::after {
    content: ''; position: absolute; left: 4.5px; top: 1px;
    width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  input[type="checkbox"]:indeterminate { background: rgba(79, 124, 255, .45); border-color: var(--accent); }
  input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pick-all input { cursor: pointer; }
  .sites-head input[type="search"],
  .sites-head select, .bulkbar select {
    background: #0d0f14; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none; cursor: pointer;
  }
  .sites-head input[type="search"] { width: 150px; cursor: text; }
  .sites-head input[type="search"]:focus,
  .sites-head select:focus, .bulkbar select:focus { border-color: var(--accent); }


  .site.picked { border-color: rgba(79, 124, 255, .75); background: #171c28; }
  .site-head-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .site-emoji {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1;
    border: 0; cursor: pointer; padding: 0; font-family: inherit;
    transition: box-shadow .15s, transform .15s;
  }
  .site-emoji:hover { transform: scale(1.08); box-shadow: 0 0 0 2px rgba(79, 124, 255, .35); }
  .site-emoji:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 改图标面板 */
  .emoji-panel {
    flex: 0 0 100%; order: 3; margin-top: 12px; padding: 14px 16px; background: #0d0f14;
    border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .emoji-row { display: flex; align-items: flex-start; gap: 10px; }
  .emoji-label { font-size: 12px; color: var(--muted); width: 42px; flex-shrink: 0; padding-top: 7px; }
  .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, 30px); gap: 6px; flex: 1; }
  .emoji-opt {
    width: 30px; height: 30px; font-size: 16px; line-height: 1;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; padding: 0; transition: .15s;
  }
  .emoji-opt:hover { border-color: var(--accent); background: #202530; transform: translateY(-1px); }
  .emoji-opt[aria-current="true"] { border-color: var(--accent); background: rgba(79, 124, 255, .16); }
  .emoji-input {
    width: 96px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 8px; font-size: 15px; outline: none; text-align: center;
  }
  .emoji-input:focus { border-color: var(--accent); }
  .emoji-row .btn { padding: 6px 11px; font-size: 12.5px; }
  .site-head-row .site-name { flex: 0 1 auto; min-width: 0; margin-bottom: 0; }
  .site-head-row input.rename { flex: 1; min-width: 0; width: auto; }
  /* 分类下拉固定贴在头部行的右端（名字与操作按钮之间），各行对齐成同一列 */
  .site-head-row .cat-cell { margin-left: auto; padding-left: 12px; }
  .cat-cell { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .cat-cell .swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .cat-cell select {
    background: transparent; border: 1px solid transparent; color: #aab2c5;
    border-radius: 6px; padding: 3px 5px; font-size: 12.5px; cursor: pointer; outline: none;
    max-width: 120px;
  }
  .cat-cell select:hover { border-color: var(--border); background: #0d0f14; }
  .cat-cell select:focus { border-color: var(--accent); background: #0d0f14; }

  .bulkbar {
    position: sticky; bottom: 16px; margin-top: 14px; display: flex; align-items: center;
    gap: 12px; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 12px;
    padding: 12px 16px; box-shadow: 0 12px 34px rgba(0,0,0,.5); font-size: 13.5px; flex-wrap: wrap;
  }
  .bulkbar .grow { flex: 1; }
  .bulkbar b { color: #8ab0ff; }

  input.rename {
    background: #0d0f14; border: 1px solid var(--accent); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-size: 14px; width: 100%; outline: none;
  }

  @media (max-width: 600px) {
    .site { flex-direction: column; align-items: stretch; gap: 12px; }
    .site-actions { justify-content: flex-end; flex-wrap: wrap; }
    .cat-row .acts { opacity: 1; }
    .cat-row input.cat-name { min-width: 80px; }
    .sites-head { flex-wrap: wrap; gap: 10px; }
    .sites-head input[type="search"] { width: 120px; }
    #app { padding: 24px 16px 56px; }
  }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="login-box">
    <h1>静态网站管理</h1>
    <p>请输入访问密码</p>
    <input id="pwd" type="password" placeholder="••••••" autocomplete="current-password" />
    <button id="loginBtn">进入</button>
    <div class="err-text" id="loginErr"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <div class="top">
    <h1>我的网站</h1>
    <div class="top-actions">
      <a id="portalLink" class="top-link" target="_blank" rel="noopener" style="display:none">门户首页 ↗</a>
      <a class="top-link" href="/llms.txt" target="_blank" rel="noopener" title="给 LLM / 自动化脚本看的接口说明">LLM 说明 ↗</a>
      <button id="logoutBtn">退出登录</button>
    </div>
  </div>

  <div id="drop">
    <div class="icon">⬆</div>
    <div class="main">把 HTML 文件或压缩包拖到这里</div>
    <div class="sub">支持 .html 单文件、.zip 整站压缩包 · 也可以点击选择文件</div>
  </div>

  <details class="manual" id="manual">
    <summary>手动新建网站（可指定端口，稍后上传内容）</summary>
    <div class="manual-body">
      <input id="newName" type="text" placeholder="网站名称" />
      <input id="newPort" type="number" placeholder="端口（留空自动分配）" />
      <button class="btn primary" id="createBtn">创建</button>
    </div>
    <div class="manual-hint" id="portHint"></div>
  </details>

  <details class="manual" id="catPanel" open>
    <summary>分类管理（门户首页按分类分组展示）</summary>
    <div class="cat-list" id="catList"></div>
    <div class="cat-add">
      <input id="catNewName" type="text" placeholder="新分类名称，回车创建（最多 20 字）" maxlength="20" />
      <button class="btn primary" id="catAddBtn">添加</button>
    </div>
    <div class="manual-hint">
      「未分类」是系统分类：始终存在、排在门户最后，不可改名或删除。<br />
      删除分类不会删站点，分类下的站点会自动移入未分类。
    </div>
  </details>

  <div class="sites-head">
    <div class="head-left">
      <span id="count"></span>
      <label class="pick-all"><input type="checkbox" id="selAll" /> 全选</label>
    </div>
    <div class="head-right">
      <input type="search" id="adminSearch" placeholder="搜索站点 / 分类 / 端口…" autocomplete="off" />
      <select id="adminFilterCat" aria-label="按分类筛选"></select>
    </div>
  </div>
  <div id="list"></div>

  <div class="bulkbar hidden" id="bulkbar">
    <span>已选 <b id="bulkCount">0</b> 个站点</span>
    <span class="grow"></span>
    <select id="bulkTarget" aria-label="批量设置的目标分类"></select>
    <button class="btn primary" id="bulkApply">应用</button>
    <button class="btn" id="bulkClear">取消</button>
  </div>
</div>

<input type="file" id="picker" accept=".zip,.html,.htm" class="hidden" />

<script>
const $ = (id) => document.getElementById(id);
let sites = [];
let categories = [];
let uncategorized = { count: 0, allCount: 0 };
let selected = new Set();
let adminQ = '';
let adminFilter = 'all';
let confirmDel = null;
let editingEmoji = null;
let warnOpenId = null;
let editingId = null;
let editingPortId = null;
let PORT_MIN = 10000;
let PORT_MAX = 65535;

/* ---------- 分类工具（调色板需与 portal.html 保持一致） ---------- */
const CAT_PALETTE = [
  ['#4f46e5', '#818cf8'],
  ['#0891b2', '#22d3ee'],
  ['#ea580c', '#fb923c'],
  ['#db2777', '#f472b6'],
  ['#059669', '#34d399'],
  ['#7c3aed', '#a78bfa'],
];
const UNCAT_COLOR = ['#94a3b8', '#cbd5e1'];
const CAT_NAME_MAX = 20;

const catById = (id) => (id ? categories.find((c) => c.id === id) || null : null);
const sortedCats = () => [...categories].sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
const catColor = (cat) => (cat ? CAT_PALETTE[cat.color % CAT_PALETTE.length] : UNCAT_COLOR);

async function loadCategories() {
  const data = await api('GET', '/api/categories');
  categories = data.categories || [];
  uncategorized = data.uncategorized || { count: 0, allCount: 0 };
}

/** 当前筛选条件下的站点（搜索 + 分类） */
/** 站点的提示详情（默认折叠，保证每行高度一致） */
function warnPanelHtml(s) {
  if (warnOpenId !== s.id) return '';
  const warns = Array.isArray(s.warnings) ? s.warnings : [];
  if (!warns.length) return '';
  return `
    <div class="warn-panel">
      ${warns.map((w, i) => `<div class="warn-item"><span class="idx">${i + 1}</span><span>${esc(w)}</span></div>`).join('')}
    </div>`;
}

/** 改图标：set / random / guess 三种模式，失败（如撞图标）时保留面板让用户重选 */
async function setEmoji(id, payload) {
  try {
    const site = await api('POST', `/api/sites/${id}/emoji`, payload);
    const local = sites.find((x) => x.id === id);
    if (local) local.emoji = site.emoji;
    editingEmoji = null;
    render();
    toast(`图标已改为 ${site.emoji}`, 'ok');
  } catch (e) {
    toast(`❌ ${e.message}`, 'err');
  }
}

const EMOJI_PICKER = ['🚀','🏠','📊','📈','📚','🧪','🎉','⚙️','🛡️','💳','🎫','🛒','🔍','🗂️','📅','🎨','🧩','🌐','📱','📮','🎬','🎵','🖼️','🗺️','⚡','🔔','💎','🧭'];

/** 站点行的「改图标」面板（点图标块展开） */
function emojiPanelHtml(s) {
  if (editingEmoji !== s.id) return '';
  const cands = Array.isArray(s.emojiCandidates) ? s.emojiCandidates : [];
  const opt = (e) => `<button class="emoji-opt" data-emoji-set="${esc(e)}" data-id="${s.id}" aria-label="使用 ${esc(e)}"${e === s.emoji ? ' aria-current="true"' : ''}>${esc(e)}</button>`;
  return `
    <div class="emoji-panel">
      ${cands.length ? `<div class="emoji-row"><span class="emoji-label">按名称</span><span class="emoji-grid">${cands.map(opt).join('')}</span></div>` : ''}
      <div class="emoji-row"><span class="emoji-label">常用</span><span class="emoji-grid">${EMOJI_PICKER.map(opt).join('')}</span></div>
      <div class="emoji-row">
        <span class="emoji-label">自定义</span>
        <input class="emoji-input" data-emoji-input="${s.id}" placeholder="粘贴 emoji" maxlength="8" aria-label="自定义图标" />
        <button class="btn" data-emoji-apply="${s.id}">确定</button>
        <button class="btn" data-emoji-random="${s.id}">随机一个</button>
        <button class="btn" data-emoji-guess="${s.id}">按名称重设</button>
        <button class="btn" data-emoji-close="${s.id}">关闭</button>
      </div>
    </div>`;
}

function filteredSites() {
  const q = adminQ.trim().toLowerCase();
  return sites.filter((s) => {
    if (adminFilter !== 'all') {
      if (adminFilter === '__none' ? s.categoryId : s.categoryId !== adminFilter) return false;
    }
    if (!q) return true;
    return `${s.name} ${s.category ? s.category.name : '未分类'} ${s.url} ${s.emoji || ''}`.toLowerCase().includes(q);
  });
}

function catOptions(selectedId, withAll = false) {
  const parts = [];
  if (withAll) parts.push(`<option value="all"${selectedId === 'all' ? ' selected' : ''}>全部分类</option>`);
  for (const c of sortedCats()) {
    parts.push(`<option value="${c.id}"${selectedId === c.id ? ' selected' : ''}>${esc(c.name)}</option>`);
  }
  const noneSel = selectedId === '__none' || selectedId === null || selectedId === undefined;
  parts.push(`<option value="__none"${noneSel ? ' selected' : ''}>未分类</option>`);
  return parts.join('');
}

function syncSelAll() {
  const rows = filteredSites();
  $('selAll').checked = rows.length > 0 && rows.every((s) => selected.has(s.id));
}

function renderBulkBar() {
  $('bulkbar').classList.toggle('hidden', selected.size === 0);
  $('bulkCount').textContent = selected.size;
  const box = $('bulkTarget');
  const cur = box.value;
  box.innerHTML = catOptions(cur || null);
  if (cur && [...box.options].some((o) => o.value === cur)) box.value = cur;
}

function updateHead() {
  const rows = filteredSites();
  $('count').textContent = sites.length
    ? `共 ${sites.length} 个网站${rows.length !== sites.length ? ` · 筛出 ${rows.length}` : ''}`
    : '';
  $('adminFilterCat').innerHTML = catOptions(adminFilter, true);
  syncSelAll();
}

/** 客户端预校验（服务端会再校验一次，以服务端为准） */
function checkPort(raw) {
  if (raw === undefined || raw === null || String(raw).trim() === '') return null; // 留空=自动
  const n = Number(raw);
  if (!Number.isInteger(n)) return '端口必须是整数';
  if (n < PORT_MIN) return `端口不能小于 ${PORT_MIN}`;
  if (n > PORT_MAX) return `端口不能大于 ${PORT_MAX}`;
  return null;
}

// ---------- 通用请求 ----------
async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body instanceof FormData) {
    opt.body = body;
  } else if (body !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  const res = await fetch(url, opt);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && url !== '/api/login') {
    showLogin();
    throw new Error('登录已过期，请重新登录');
  }
  if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`);
  return data;
}

let toastTimer;
function toast(text, kind = 'ok') {
  let el = document.querySelector('.toast');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.className = `toast ${kind}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el?.remove(), 4000);
}

// ---------- 登录 ----------
function showLogin() {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('pwd').value = '';
  $('pwd').focus();
}

function showApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  refresh();
}

$('loginBtn').addEventListener('click', doLogin);
$('pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const password = $('pwd').value;
  if (!password) return;
  $('loginErr').textContent = '';
  try {
    await api('POST', '/api/login', { password });
    showApp();
  } catch (e) {
    $('loginErr').textContent = e.message;
  }
}

$('logoutBtn').addEventListener('click', async () => {
  await api('POST', '/api/logout').catch(() => {});
  showLogin();
});

// ---------- 上传 ----------
function uploadFile(file) {
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const drop = $('drop');
  drop.classList.add('busy');
  const mainEl = drop.querySelector('.main');
  const prev = mainEl.textContent;
  mainEl.textContent = '正在上传…';

  api('POST', '/api/publish', fd)
    .then((site) => {
      if (site.warnings && site.warnings.length) {
        toast(`⚠️ 已发布，但可能有问题：${site.warnings[0]}`, 'err');
      } else if (site.entry === null) {
        toast('⚠️ 已上传，但压缩包里没找到 .html 文件，请检查内容', 'err');
      } else {
        toast(`✅ 已发布：${site.name}`, 'ok');
        copyText(site.url);
      }
      refresh();
    })
    .catch((e) => toast(`❌ ${e.message}`, 'err'))
    .finally(() => {
      drop.classList.remove('busy');
      mainEl.textContent = prev;
      $('picker').value = '';
    });
}

const drop = $('drop');
drop.addEventListener('click', () => $('picker').click());
$('picker').addEventListener('change', (e) => uploadFile(e.target.files[0]));
['dragenter', 'dragover'].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); })
);
['dragleave', 'drop'].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); })
);
drop.addEventListener('drop', (e) => uploadFile(e.dataTransfer.files[0]));

// ---------- 手动新建 ----------
$('newPort').addEventListener('input', () => {
  const v = $('newPort').value.trim();
  const hint = $('portHint');
  const err = checkPort(v);
  hint.textContent = err ? `⚠️ ${err}` : `端口范围 ${PORT_MIN}-${PORT_MAX}，留空则自动分配`;
  hint.style.color = err ? 'var(--err)' : 'var(--muted)';
});

async function createSite() {
  const name = $('newName').value.trim();
  const portRaw = $('newPort').value.trim();
  if (!name) return toast('请填写网站名称', 'err');

  const err = checkPort(portRaw);
  if (err) return toast(`❌ ${err}`, 'err');

  const btn = $('createBtn');
  btn.disabled = true;
  try {
    const site = await api('POST', '/api/sites', { name, port: portRaw === '' ? undefined : Number(portRaw) });
    toast(`✅ 已创建「${site.name}」，端口 ${site.port}，现在可以上传内容`, 'ok');
    $('newName').value = '';
    $('newPort').value = '';
    $('portHint').textContent = '';
    refresh();
  } catch (e) {
    toast(`❌ ${e.message}`, 'err');
  } finally {
    btn.disabled = false;
  }
}

$('createBtn').addEventListener('click', createSite);
$('newPort').addEventListener('keydown', (e) => { if (e.key === 'Enter') createSite(); });
$('newName').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('newPort').focus(); });

// ---------- 列表 ----------
async function refresh() {
  try {
    const [data] = await Promise.all([api('GET', '/api/sites'), loadCategories()]);
    sites = data.sites;
    // 清掉已不存在的勾选（站点被删/被筛掉后不应残留）
    for (const id of [...selected]) if (!sites.some((s) => s.id === id)) selected.delete(id);
  } catch {
    return;
  }
  renderCats();
  render();
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diff = Date.now() - d.getTime();
  if (diff < 60e3) return '刚刚更新';
  if (diff < 3600e3) return `${Math.floor(diff / 60e3)} 分钟前更新`;
  if (diff < 864e5) return `${Math.floor(diff / 3600e3)} 小时前更新`;
  return `${d.getMonth() + 1}月${d.getDate()}日更新`;
}

function render() {
  const list = $('list');
  updateHead();
  if (!sites.length) {
    selected.clear();
    renderBulkBar();
    list.innerHTML = '<div class="empty">还没有网站，把文件拖到上方框内即可发布第一个</div>';
    return;
  }
  const rows = filteredSites();
  if (!rows.length) {
    selected.clear();
    renderBulkBar();
    list.innerHTML = '<div class="empty">当前筛选条件下没有站点，试试清空搜索或选「全部分类」</div>';
    return;
  }
  list.innerHTML = rows.map((s) => {
    const nameHtml = editingId === s.id
      ? `<input class="rename" data-rename="${s.id}" value="${esc(s.name)}" />`
      : `<div class="site-name" title="${esc(s.name)}">${esc(s.name)}</div>`;
    const status = s.published ? fmtTime(s.updatedAt) : '尚未发布内容';
    const portHtml = editingPortId === s.id
      ? `<div class="port-edit">
           <span>新端口</span>
           <input class="rename" data-portinput="${s.id}" type="number" value="${s.port}" min="${PORT_MIN}" max="${PORT_MAX}" />
           <span>≥ ${PORT_MIN}</span>
         </div>`
      : `<div class="site-meta">${status} · 端口 ${s.port}</div>`;

    const catCell = `
      <span class="cat-cell">
        <span class="swatch" style="background:${catColor(catById(s.categoryId))[0]}"></span>
        <select data-move="${s.id}" aria-label="「${esc(s.name)}」的分类">${catOptions(s.categoryId)}</select>
      </span>`;
    const warns = Array.isArray(s.warnings) ? s.warnings : [];
    const warnChip = warns.length
      ? `<button class="warn-chip" data-warn-open="${s.id}" title="${esc(warns.join('\n'))}" aria-expanded="${warnOpenId === s.id}" aria-label="查看「${esc(s.name)}」的 ${warns.length} 条提示">⚠ ${warns.length}</button>`
      : '';
    return `
      <div class="site${selected.has(s.id) ? ' picked' : ''}" data-id="${s.id}">
        <input type="checkbox" data-pick="${s.id}" aria-label="选择「${esc(s.name)}」"${selected.has(s.id) ? ' checked' : ''} />
        <div class="site-main">
          <div class="site-head-row"><button class="site-emoji" data-emoji-open="${s.id}" title="更改图标" aria-label="更改「${esc(s.name)}」的图标" style="background:linear-gradient(135deg,${catColor(catById(s.categoryId))[0]}2e,${catColor(catById(s.categoryId))[1]}17)">${esc(s.emoji || '·')}</button>${nameHtml}${warnChip}${catCell}</div>
          <a class="site-url" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>
          ${portHtml}
        </div>
        ${warnPanelHtml(s)}
        ${emojiPanelHtml(s)}
        <div class="site-actions">
          <button class="btn" data-copy="${esc(s.url)}" title="复制访问链接">复制</button>
          <button class="btn" data-update="${s.id}">更新</button>
          <button class="btn" data-port="${s.id}">改端口</button>
          <button class="btn" data-toggle="${s.id}" title="${s.hidden ? '点击后在门户首页显示' : '点击后不在门户首页展示（直连仍可访问）'}">${s.hidden ? '门户显示' : '门户隐藏'}</button>
          <button class="btn" data-edit="${s.id}">改名</button>
          <button class="btn danger" data-del="${s.id}">删除</button>
        </div>
      </div>`;
  }).join('');

  // 复制
  list.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', () => copyText(btn.dataset.copy));
  });
  // 更新（重新上传）
  list.querySelectorAll('[data-update]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.zip,.html,.htm';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        const fd = new FormData();
        fd.append('file', file);
        btn.disabled = true;
        btn.textContent = '上传中…';
        try {
          const site = await api('POST', `/api/sites/${btn.dataset.update}/deploy`, fd);
          const hasWarn = site.warnings && site.warnings.length;
          toast(
            hasWarn
              ? `⚠️ 已更新，但可能有问题：${site.warnings[0]}`
              : site.entry === null
                ? '⚠️ 已上传，但压缩包里没找到 .html 文件'
                : `✅ 已更新：${site.name}`,
            hasWarn || site.entry === null ? 'err' : 'ok'
          );
          refresh();
        } catch (e) {
          toast(`❌ ${e.message}`, 'err');
          btn.disabled = false;
          btn.textContent = '更新';
        }
      };
      input.click();
    });
  });
  // 门户可见性切换
  list.querySelectorAll('[data-toggle]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const site = sites.find((s) => s.id === btn.dataset.toggle);
      if (!site) return;
      try {
        const r = await api('PATCH', `/api/sites/${site.id}`, { hidden: !site.hidden });
        toast(r.hidden ? '已从门户隐藏' : '已在门户显示', 'ok');
        refresh();
      } catch (e) {
        toast(`❌ ${e.message}`, 'err');
      }
    });
  });
  // 改端口
  list.querySelectorAll('[data-port]').forEach((btn) => {
    btn.addEventListener('click', () => {
      editingPortId = btn.dataset.port;
      editingId = null;
      render();
      const input = list.querySelector('[data-portinput]');
      if (!input) return;
      input.focus();
      input.select();

      let saving = false;
      const commit = async () => {
        if (saving) return;
        saving = true;
        const err = checkPort(input.value);
        if (err) {
          toast(`❌ ${err}`, 'err');
          saving = false;
          input.focus();
          return;
        }
        try {
          const r = await api('PATCH', `/api/sites/${btn.dataset.port}`, { port: Number(input.value) });
          toast(`✅ 端口已改为 ${r.port}，新链接：${r.url}`, 'ok');
          editingPortId = null;
          refresh();
        } catch (e) {
          toast(`❌ ${e.message}`, 'err');
          saving = false;
          input.focus();
        }
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') { editingPortId = null; render(); }
      });
      input.addEventListener('blur', () => { if (!saving) commit(); });
    });
  });
  // 改名
  list.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.addEventListener('click', () => {
      editingId = btn.dataset.edit;
      editingPortId = null;
      render();
      const input = list.querySelector('[data-rename]');
      if (input) {
        input.focus();
        input.select();
        const save = async () => {
          editingId = null;
          try {
            await api('PATCH', `/api/sites/${btn.dataset.edit}`, { name: input.value });
          } catch (e) {
            toast(`❌ ${e.message}`, 'err');
          }
          refresh();
        };
        input.addEventListener('blur', save, { once: true });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') input.blur();
          if (e.key === 'Escape') { editingId = null; render(); }
        });
      }
    });
  });
  // 删除
  list.querySelectorAll('[data-del]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const site = sites.find((s) => s.id === btn.dataset.del);
      if (!confirm(`确定删除「${site?.name}」？删除后链接立即失效。`)) return;
      try {
        await api('DELETE', `/api/sites/${btn.dataset.del}`);
        toast('已删除', 'ok');
        refresh();
      } catch (e) {
        toast(`❌ ${e.message}`, 'err');
      }
    });
  });

  // 警告芯片：展开/收起该站点的提示详情（再次点击或点开别的站点会收起）
  list.querySelectorAll('[data-warn-open]').forEach((btn) => {
    btn.addEventListener('click', () => {
      warnOpenId = warnOpenId === btn.dataset.warnOpen ? null : btn.dataset.warnOpen;
      render();
    });
  });

  // 改图标：点图标块展开/收起面板
  list.querySelectorAll('[data-emoji-open]').forEach((btn) => {
    btn.addEventListener('click', () => {
      editingEmoji = editingEmoji === btn.dataset.emojiOpen ? null : btn.dataset.emojiOpen;
      render();
      const inp = list.querySelector('.emoji-input');
      if (inp) inp.focus();
    });
  });
  list.querySelectorAll('[data-emoji-set]').forEach((b) => {
    b.addEventListener('click', () => setEmoji(b.dataset.id, { mode: 'set', emoji: b.dataset.emojiSet }));
  });
  list.querySelectorAll('[data-emoji-random]').forEach((b) => {
    b.addEventListener('click', () => setEmoji(b.dataset.emojiRandom, { mode: 'random' }));
  });
  list.querySelectorAll('[data-emoji-guess]').forEach((b) => {
    b.addEventListener('click', () => setEmoji(b.dataset.emojiGuess, { mode: 'guess' }));
  });
  list.querySelectorAll('[data-emoji-close]').forEach((b) => {
    b.addEventListener('click', () => { editingEmoji = null; render(); });
  });
  list.querySelectorAll('[data-emoji-apply]').forEach((b) => {
    const go = () => {
      const inp = list.querySelector(`[data-emoji-input="${b.dataset.emojiApply}"]`);
      const v = (inp?.value || '').trim();
      if (!v) return toast('请先粘贴一个 emoji', 'err');
      setEmoji(b.dataset.emojiApply, { mode: 'set', emoji: v });
    };
    b.addEventListener('click', go);
    const inp = list.querySelector(`[data-emoji-input="${b.dataset.emojiApply}"]`);
    inp?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
    inp?.addEventListener('input', () => {
      // 粘贴/输入第一个字符就预览：把面板里被选中的项高亮到匹配项
      const v = [...(inp.value || '')].slice(0, 2).join('');
      inp.value = v;
    });
  });

  // 勾选：只切 class，不重建整表（否则焦点与连续勾选会断）
  list.querySelectorAll('[data-pick]').forEach((cb) => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.pick;
      if (cb.checked) selected.add(id); else selected.delete(id);
      cb.closest('.site')?.classList.toggle('picked', cb.checked);
      renderBulkBar();
      syncSelAll();
    });
  });

  // 行内改分类：乐观更新该行，失败回滚（不重建列表）
  list.querySelectorAll('[data-move]').forEach((sel) => {
    sel.addEventListener('change', async () => {
      const site = sites.find((x) => x.id === sel.dataset.move);
      if (!site) return;
      const nextId = sel.value === '__none' ? null : sel.value;
      const prevId = site.categoryId || null;
      const prevCat = site.category || null;
      if (nextId === prevId) return;

      const apply = (id, cat) => {
        site.categoryId = id;
        site.category = cat;
        const sw = sel.closest('.cat-cell')?.querySelector('.swatch');
        if (sw) sw.style.background = catColor(catById(id))[0];
      };

      apply(nextId, catById(nextId));
      try {
        await api('PATCH', `/api/sites/${site.id}`, { categoryId: nextId });
        toast(nextId ? `「${site.name}」已移至「${catById(nextId).name}」` : `「${site.name}」已移入未分类`, 'ok');
        await loadCategories();
        renderCats();
        updateHead();
      } catch (e) {
        apply(prevId, prevCat);
        sel.value = prevId || '__none';
        toast(`❌ ${e.message}`, 'err');
      }
    });
  });

  renderBulkBar();
  syncSelAll();
}

// ---------- 分类面板 ----------
function renderCats() {
  const box = $('catList');
  const cats = sortedCats();

  const rows = cats.map((c, i) => {
    const hid = c.allCount - c.count;
    if (confirmDel === c.id) {
      return `
        <div class="cat-row" data-cat="${c.id}">
          <div class="cat-confirm">
            <span>删除「${esc(c.name)}」后，<b>${c.allCount} 个站点</b>将移入未分类${hid ? `（其中 ${hid} 个已在门户隐藏）` : ''}，站点本身不受影响。</span>
            <span class="grow"></span>
            <button class="btn danger" data-cat-confirm="${c.id}">确认删除</button>
            <button class="btn" data-cat-cancel="${c.id}">取消</button>
          </div>
        </div>`;
    }
    return `
      <div class="cat-row" data-cat="${c.id}">
        <span class="swatch" style="background:${CAT_PALETTE[c.color % CAT_PALETTE.length][0]}"></span>
        <input class="cat-name" data-cat-name="${c.id}" value="${esc(c.name)}" maxlength="${CAT_NAME_MAX}" aria-label="分类名称" />
        <span class="cat-n">${c.count} 个站点${hid ? `（含 ${hid} 隐藏）` : ''}</span>
        <span class="acts">
          <button class="icon-btn" data-cat-up="${c.id}" ${i === 0 ? 'disabled' : ''} title="上移">↑</button>
          <button class="icon-btn" data-cat-down="${c.id}" ${i === cats.length - 1 ? 'disabled' : ''} title="下移">↓</button>
          <button class="icon-btn danger" data-cat-del="${c.id}" title="删除分类">✕</button>
        </span>
      </div>`;
  }).join('');

  const sysHid = uncategorized.allCount - uncategorized.count;
  box.innerHTML = (rows || '<div class="cat-empty">还没有分类，先建一个（例如「客户项目」「内部工具」）。</div>') + `
    <div class="cat-row">
      <span class="swatch" style="background:${UNCAT_COLOR[0]}"></span>
      <span style="font-size:14px;padding:5px 8px;color:var(--muted)">未分类</span>
      <span class="cat-n">${uncategorized.count} 个站点${sysHid ? `（含 ${sysHid} 隐藏）` : ''}</span>
      <span class="acts" style="opacity:1"><span class="cat-sys">系统</span></span>
    </div>`;

  // 行内改名
  box.querySelectorAll('[data-cat-name]').forEach((inp) => {
    const save = async () => {
      const cat = catById(inp.dataset.catName);
      if (!cat) return;
      const v = inp.value.trim();
      if (!v || v === cat.name) { inp.value = cat.name; return; }
      try {
        await api('PATCH', `/api/categories/${cat.id}`, { name: v });
        await loadCategories();
        renderCats();
        render();
        toast(`已改名为「${v}」`, 'ok');
      } catch (e) {
        inp.value = cat.name;
        toast(`❌ ${e.message}`, 'err');
      }
    };
    inp.addEventListener('blur', save);
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      if (e.key === 'Escape') { const c = catById(inp.dataset.catName); if (c) inp.value = c.name; inp.blur(); }
    });
  });

  // 排序：交换后一次 PUT 完整顺序，避免多次 PATCH 产生中间态
  box.querySelectorAll('[data-cat-up],[data-cat-down]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.catUp || btn.dataset.catDown;
      const arr = sortedCats();
      const i = arr.findIndex((c) => c.id === id);
      const j = i + (btn.dataset.catUp ? -1 : 1);
      if (i < 0 || j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      try {
        await api('PUT', '/api/categories/order', { ids: arr.map((c) => c.id) });
        await loadCategories();
        renderCats();
        render();
      } catch (e) {
        toast(`❌ ${e.message}`, 'err');
      }
    });
  });

  // 删除：行内二次确认
  box.querySelectorAll('[data-cat-del]').forEach((btn) => {
    btn.addEventListener('click', () => { confirmDel = btn.dataset.catDel; renderCats(); });
  });
  box.querySelectorAll('[data-cat-cancel]').forEach((btn) => {
    btn.addEventListener('click', () => { confirmDel = null; renderCats(); });
  });
  box.querySelectorAll('[data-cat-confirm]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.catConfirm;
      try {
        const r = await api('DELETE', `/api/categories/${id}`);
        confirmDel = null;
        if (adminFilter === id) adminFilter = 'all';
        const data = await api('GET', '/api/sites');
        sites = data.sites;
        await loadCategories();
        renderCats();
        render();
        toast(`已删除「${r.name}」，${r.moved} 个站点移入未分类`, 'ok');
      } catch (e) {
        toast(`❌ ${e.message}`, 'err');
      }
    });
  });
}

async function addCategory() {
  const inp = $('catNewName');
  const name = inp.value.trim();
  if (!name) return;
  try {
    await api('POST', '/api/categories', { name });
    inp.value = '';
    await loadCategories();
    renderCats();
    render();
    toast(`已创建分类「${name}」`, 'ok');
  } catch (e) {
    toast(`❌ ${e.message}`, 'err');
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('链接已复制，直接粘贴发给别人即可', 'ok');
  } catch {
    // 非 HTTPS 环境下 clipboard 不可用，降级
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('链接已复制', 'ok');
  }
}

// ---------- 分类 / 筛选 / 批量 ----------
$('adminSearch').addEventListener('input', (e) => { adminQ = e.target.value; render(); });

// ⌘K / Ctrl+K 聚焦管理页搜索（Esc 清空）
document.addEventListener('keydown', (e) => {
  if (document.getElementById('app')?.classList.contains('hidden')) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    $('adminSearch').focus();
    $('adminSearch').select();
    return;
  }
  if (e.key === 'Escape' && document.activeElement === $('adminSearch')) {
    adminQ = '';
    $('adminSearch').value = '';
    render();
    $('adminSearch').blur();
  }
});
$('adminFilterCat').addEventListener('change', (e) => { adminFilter = e.target.value; render(); });

$('selAll').addEventListener('change', (e) => {
  const rows = filteredSites();
  rows.forEach((s) => (e.target.checked ? selected.add(s.id) : selected.delete(s.id)));
  render();
});

$('bulkApply').addEventListener('click', async () => {
  const target = $('bulkTarget').value;
  const categoryId = target === '__none' ? null : target;
  const ids = [...selected];
  if (!ids.length) return;
  try {
    const r = await api('POST', '/api/sites/batch-category', { ids, categoryId });
    selected.clear();
    const data = await api('GET', '/api/sites');
    sites = data.sites;
    await loadCategories();
    renderCats();
    render();
    toast(`已将 ${r.moved} 个站点移至「${categoryId ? catById(categoryId).name : '未分类'}」`, 'ok');
  } catch (e) {
    toast(`❌ ${e.message}`, 'err');
  }
});

$('bulkClear').addEventListener('click', () => {
  selected.clear();
  render();
});

$('catAddBtn').addEventListener('click', addCategory);
$('catNewName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addCategory(); }
});

// ---------- 启动 ----------
(async () => {
  try {
    const { authed, portalUrl, portMin, portMax } = await api('GET', '/api/session');
    if (typeof portMin === 'number') PORT_MIN = portMin;
    if (typeof portMax === 'number') PORT_MAX = portMax;
    $('newPort').placeholder = `端口（≥${PORT_MIN}，留空自动）`;
    $('newPort').min = PORT_MIN;
    $('newPort').max = PORT_MAX;
    $('portHint').textContent = `端口范围 ${PORT_MIN}-${PORT_MAX}，留空则自动分配`;

    if (portalUrl) {
      const link = $('portalLink');
      link.href = portalUrl;
      link.style.display = '';
    }
    authed ? showApp() : showLogin();
  } catch {
    showLogin();
  }
})();
</script>
</body>
