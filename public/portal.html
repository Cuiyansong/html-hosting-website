<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<title>网站导航</title>
<style>
  /* ============ 布局：左侧导航 + 右侧内容，整页不滚动 ============
     - 外层 app 固定 100dvh，sidebar 自己滚，内容区自己滚
     - 视觉延续 apple.com：中性灰阶、无边框瓦片、胶囊控件
  ============================================================== */
  :root {
    --bg: #ffffff;
    --side-bg: #f5f5f7;
    --tile: #f5f5f7;
    --tile-hover: #ecedf0;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #86868b;
    --line: #d2d2d7;
    --hairline: rgba(0, 0, 0, .08);
    --accent: #0066cc;
    --ring: rgba(0, 113, 227, .28);
    --active: #ffffff;
    --hover: rgba(0, 0, 0, .045);
    --side-w: 268px;
    --ease: cubic-bezier(.4, 0, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --side-bg: #131315;
      --tile: #1d1d1f;
      --tile-hover: #26262a;
      --text: #f5f5f7;
      --text-2: #a1a1a6;
      --text-3: #86868b;
      --line: #2d2d2f;
      --hairline: rgba(255, 255, 255, .1);
      --accent: #2997ff;
      --ring: rgba(41, 151, 255, .35);
      --active: #2c2c2e;
      --hover: rgba(255, 255, 255, .06);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { color-scheme: light dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text",
          "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    letter-spacing: -.01em;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  .app {
    display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr);
    height: 100dvh;
  }

  /* ---------------- 左侧导航 ---------------- */
  .side {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--side-bg); border-right: 1px solid var(--hairline);
    padding: 22px 14px 16px;
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px; padding: 0 10px 4px;
    font-size: 15px; font-weight: 600; letter-spacing: -.015em;
  }
  .brand small { font-size: 11.5px; font-weight: 400; color: var(--text-3); letter-spacing: 0; }

  .search-field {
    display: flex; align-items: center; gap: 7px; margin: 14px 2px 4px;
    background: var(--bg); border-radius: 999px; padding: 0 11px; height: 34px;
    box-shadow: inset 0 0 0 1px var(--hairline);
    transition: box-shadow .2s var(--ease);
  }
  .search-field:focus-within { box-shadow: inset 0 0 0 1px var(--line), 0 0 0 3px var(--ring); }
  .search-field svg { flex-shrink: 0; color: var(--text-3); }
  .search-field input {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
    font: inherit; font-size: 13.5px; letter-spacing: -.005em; color: var(--text);
  }
  .search-field input::placeholder { color: var(--text-3); }

  .nav-label {
    padding: 18px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text-3);
  }
  .nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; min-width: 0; padding: 0 2px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: 0; background: transparent; cursor: pointer; text-align: left;
    padding: 7px 9px; border-radius: 8px; font-size: 13.5px; letter-spacing: -.005em;
    color: var(--text-2); transition: background .18s var(--ease), color .18s var(--ease);
  }
  .nav-item:hover { background: var(--hover); color: var(--text); }
  .nav-item[aria-current="true"] {
    background: var(--active); color: var(--text); font-weight: 500;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 .5px rgba(0, 0, 0, .04);
  }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nav-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .nav-item .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .n { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .nav-item[aria-current="true"] .n { color: var(--text-2); }

  .side-foot {
    margin-top: auto; padding: 12px 10px 2px; font-size: 11px; color: var(--text-3);
    border-top: 1px solid var(--hairline); letter-spacing: 0;
  }

  /* ---------------- 右侧内容 ---------------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .main-head {
    flex-shrink: 0; padding: 26px 32px 18px; border-bottom: 1px solid var(--hairline);
    display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
  }
  .main-head h1 {
    margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.024em; line-height: 1.1;
    display: flex; align-items: center; gap: 10px;
  }
  .sub { font-size: 13px; color: var(--text-3); letter-spacing: 0; padding-bottom: 3px; }
  .sub b { color: var(--text-2); font-weight: 500; }
  .sub .clear {
    border: 0; background: transparent; color: var(--accent); cursor: pointer;
    padding: 0 0 0 4px; font-size: 13px;
  }
  .sub .clear:hover { text-decoration: underline; }

  .main-body {
    flex: 1; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    padding: 22px 32px 32px; scrollbar-width: thin;
  }
  .main-body::-webkit-scrollbar { width: 10px; }
  .main-body::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, .16); border-radius: 999px;
    border: 3px solid transparent; background-clip: padding-box;
  }
  .main-body::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, .3); background-clip: padding-box; }
  @media (prefers-color-scheme: dark) {
    .main-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); background-clip: padding-box; }
  }

  /* ---------------- 卡片 ---------------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 14px; min-width: 0; }
  .card {
    display: flex; flex-direction: column; min-width: 0; background: var(--tile);
    border-radius: 16px; padding: 18px 18px 16px; text-decoration: none;
    transition: transform .28s var(--ease), background .28s var(--ease), box-shadow .28s var(--ease);
    animation: rise .45s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
  .card:hover { background: var(--tile-hover); transform: translateY(-3px); box-shadow: 0 14px 32px rgba(0, 0, 0, .1); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .tile {
    width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 21px; line-height: 1;
  }
  .card-name {
    margin: 15px 0 0; font-size: 15.5px; font-weight: 600; letter-spacing: -.015em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-meta { margin: 4px 0 0; font-size: 12.5px; color: var(--text-3); letter-spacing: 0; }
  .card-cta {
    margin-top: 12px; font-size: 12.5px; color: var(--accent); font-weight: 500;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .card-cta span { transition: transform .28s var(--ease); }
  .card:hover .card-cta span { transform: translateX(3px); }

  mark { background: rgba(0, 102, 204, .16); color: inherit; border-radius: 3px; padding: 0 1px; }
  @media (prefers-color-scheme: dark) { mark { background: rgba(41, 151, 255, .3); } }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60%; text-align: center; color: var(--text-2); }
  .empty .big { font-size: 30px; margin-bottom: 10px; opacity: .5; }
  .empty p { margin: 0; font-size: 15px; }
  .empty button {
    margin-top: 16px; border: 0; cursor: pointer; font-size: 13.5px;
    background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 18px;
  }
  .empty button:hover { filter: brightness(1.08); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------------- 窄屏：导航收到顶部，内容区仍然自己滚 ---------------- */
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .side {
      border-right: 0; border-bottom: 1px solid var(--hairline);
      padding: 14px 14px 10px; max-height: 46dvh; min-width: 0;
    }
    .brand { padding-bottom: 0; }
    .search-field { margin: 10px 0 6px; }
    .nav-label { display: none; }
    .nav {
      flex-direction: row; gap: 6px; overflow-x: auto; overflow-y: hidden;
      padding: 4px 0 6px; scrollbar-width: none; min-width: 0; max-width: 100%;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav-item {
      width: auto; white-space: nowrap; background: var(--bg);
      box-shadow: inset 0 0 0 1px var(--hairline); border-radius: 999px; padding: 6px 13px;
    }
    .nav-item[aria-current="true"] { box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    .side-foot { display: none; }
    .main-head { padding: 16px 18px 12px; }
    .main-head h1 { font-size: 21px; }
    .main-body { padding: 16px 18px 28px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .card { padding: 15px 15px 13px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">网站导航 <small id="brandCount"></small></div>

    <label class="search-field">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" />
      </svg>
      <input type="search" id="search" placeholder="搜索网站 / 分类 / 端口" autocomplete="off" aria-label="搜索网站、分类或端口" />
    </label>

    <div class="nav-label">分类</div>
    <nav class="nav" id="nav" aria-label="分类筛选"></nav>

    <div class="side-foot" id="sideFoot">内部静态网站</div>
  </aside>

  <main class="main">
    <header class="main-head">
      <h1 id="title">全部网站</h1>
      <div class="sub" id="sub"></div>
    </header>
    <div class="main-body" id="content"></div>
  </main>
</div>

<script>
const CAT_PALETTE = [
  ['#4f46e5', '#818cf8'],
  ['#0891b2', '#22d3ee'],
  ['#ea580c', '#fb923c'],
  ['#db2777', '#f472b6'],
  ['#059669', '#34d399'],
  ['#7c3aed', '#a78bfa'],
];
const UNCAT_COLOR = ['#94a3b8', '#cbd5e1'];

const state = { categories: [], sites: [], q: '', cat: 'all' };

const $ = (id) => document.getElementById(id);
const catById = (id) => (id ? state.categories.find((c) => c.id === id) || null : null);
const catColor = (cat) => (cat ? CAT_PALETTE[cat.color % CAT_PALETTE.length] : UNCAT_COLOR);
const byOrder = (a, b) => a.order - b.order || a.name.localeCompare(b.name);
const catNameOf = (id) => {
  const c = catById(id);
  return c ? c.name : '未分类';
};

function fmt(iso) {
  if (!iso) return '已发布';
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 60e3) return '刚刚更新';
  if (diff < 3600e3) return `${Math.floor(diff / 60e3)} 分钟前更新`;
  if (diff < 864e5) return `${Math.floor(diff / 3600e3)} 小时前更新`;
  if (diff < 30 * 864e5) return `${Math.floor(diff / 864e5)} 天前更新`;
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** 搜索范围：站点名 + 分类名 + 端口/地址 + 图标字符 */
function matchSite(s, q) {
  return `${s.name} ${catNameOf(s.categoryId)} ${s.url} ${s.emoji || ''}`.toLowerCase().includes(q);
}

/** 命中片段包 <mark>（逐段转义，避免 XSS） */
function highlight(text, q) {
  const str = String(text ?? '');
  if (!q) return esc(str);
  const lower = str.toLowerCase();
  const out = [];
  let i = 0;
  while (i < str.length) {
    const at = lower.indexOf(q, i);
    if (at < 0) { out.push(esc(str.slice(i))); break; }
    out.push(esc(str.slice(i, at)), '<mark>' + esc(str.slice(at, at + q.length)) + '</mark>');
    i = at + q.length;
  }
  return out.join('');
}

/** 当前筛选后的站点（按更新时间倒序） */
function visibleSites() {
  const q = state.q.trim().toLowerCase();
  return state.sites
    .filter((s) => (state.cat === 'all' ? true : state.cat === '__none' ? !s.categoryId : s.categoryId === state.cat))
    .filter((s) => (q ? matchSite(s, q) : true))
    .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
}

/** 左侧导航：全部 + 有站点的分类 + 未分类 */
function renderNav() {
  const counts = new Map();
  for (const s of state.sites) {
    const k = s.categoryId || '__none';
    counts.set(k, (counts.get(k) || 0) + 1);
  }

  const items = [{ key: 'all', name: '全部网站', color: null, n: state.sites.length }];
  for (const c of state.categories.slice().sort(byOrder)) {
    const n = counts.get(c.id) || 0;
    if (n) items.push({ key: c.id, name: c.name, color: catColor(c)[0], n });
  }
  if (counts.get('__none')) {
    items.push({ key: '__none', name: '未分类', color: UNCAT_COLOR[0], n: counts.get('__none') });
  }

  $('nav').innerHTML = items.map((it) => `
    <button class="nav-item" data-cat="${esc(it.key)}" aria-current="${it.key === state.cat}">
      ${it.color ? `<span class="dot" style="background:${it.color}"></span>` : '<span class="dot" style="background:transparent"></span>'}
      <span class="txt">${esc(it.name)}</span>
      <span class="n">${it.n}</span>
    </button>`).join('');

  $('nav').querySelectorAll('[data-cat]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.cat = btn.dataset.cat;
      syncUrl();
      render();
      $('content').scrollTop = 0;   // 换分类回到顶部，符合预期
    });
  });
}

function card(s, i) {
  const cat = catById(s.categoryId);
  const [c1, c2] = catColor(cat);
  const icon = s.emoji || String(s.name || '?').trim().charAt(0) || '?';
  const q = state.q.trim().toLowerCase();
  const meta = `${cat ? cat.name : '未分类'} · ${fmt(s.updatedAt)}`;
  return `
    <a class="card" href="${esc(s.url)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i, 10) * 25}ms">
      <span class="tile" style="background:linear-gradient(135deg,${c1}2e,${c2}1a)">${esc(icon)}</span>
      <div class="card-name">${highlight(s.name, q)}</div>
      <div class="card-meta">${esc(meta)}</div>
      <div class="card-cta">打开<span aria-hidden="true">›</span></div>
    </a>`;
}

function render() {
  renderNav();

  const list = visibleSites();
  const q = state.q.trim();
  const catName = state.cat === 'all' ? '全部网站' : state.cat === '__none' ? '未分类' : catNameOf(state.cat);

  $('title').textContent = catName;
  $('brandCount').textContent = state.sites.length ? `${state.sites.length} 个站点` : '';
  $('sideFoot').textContent = state.categories.length
    ? `${state.categories.length} 个分类 · 内部静态网站`
    : '内部静态网站';

  // 头部副标题：总数 / 搜索结果 / 清除
  const filtering = Boolean(q) || state.cat !== 'all';
  $('sub').innerHTML = q
    ? `匹配「<b>${esc(q)}</b>」· <b>${list.length}</b> 个网站${filtering ? ' · <button class="clear" id="clearBtn">清除筛选</button>' : ''}`
    : `<b>${list.length}</b> 个网站${state.cat !== 'all' ? ` · <button class="clear" id="clearBtn">查看全部</button>` : ''}`;

  const clear = $('clearBtn');
  if (clear) {
    clear.addEventListener('click', () => {
      state.q = '';
      state.cat = 'all';
      $('search').value = '';
      syncUrl();
      render();
    });
  }

  const content = $('content');
  if (!list.length) {
    content.innerHTML = `
      <div class="empty">
        <div class="big">${filtering ? '🔍' : '📄'}</div>
        <p>${filtering ? '没有匹配的网站' : '还没有发布任何网站'}</p>
        ${filtering ? '<button id="resetBtn">清空筛选条件</button>' : ''}
      </div>`;
    const reset = $('resetBtn');
    if (reset) {
      reset.addEventListener('click', () => {
        state.q = '';
        state.cat = 'all';
        $('search').value = '';
        syncUrl();
        render();
      });
    }
    return;
  }

  content.innerHTML = `<div class="grid">${list.map((s, i) => card(s, i)).join('')}</div>`;
}

function syncUrl() {
  try {
    const u = new URL(location.href);
    if (state.cat === 'all') u.searchParams.delete('c'); else u.searchParams.set('c', state.cat);
    if (state.q) u.searchParams.set('q', state.q); else u.searchParams.delete('q');
    history.replaceState(null, '', u);
  } catch { /* file:// 等环境忽略 */ }
}

function readUrl() {
  try {
    const u = new URL(location.href);
    const c = u.searchParams.get('c');
    const q = u.searchParams.get('q');
    if (c) state.cat = c;
    if (q) {
      state.q = q;
      $('search').value = q;
    }
  } catch { /* ignore */ }
}

async function load() {
  try {
    const res = await fetch('/api/sites', { cache: 'no-store' });
    const data = await res.json();
    state.categories = data.categories || [];
    state.sites = data.sites || [];
    // 分类被删后 URL 里的 ?c= 失效，回落全部并清掉参数
    if (state.cat !== 'all' && state.cat !== '__none' && !catById(state.cat)) {
      state.cat = 'all';
      syncUrl();
    }
    render();
  } catch {
    $('sub').textContent = '加载失败，请刷新页面';
  }
}

$('search').addEventListener('input', (e) => {
  state.q = e.target.value;
  syncUrl();
  render();
});

// ⌘K / Ctrl+K 聚焦搜索；Esc 清空
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    $('search').focus();
    $('search').select();
    return;
  }
  if (e.key === 'Escape' && document.activeElement === $('search')) {
    if (state.q) {
      state.q = '';
      $('search').value = '';
      syncUrl();
      render();
    }
    $('search').blur();
  }
});

readUrl();
load();
setInterval(load, 30000);  // 每 30 秒自动刷新
</script>
</body>
</html>
